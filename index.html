<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Brébeuf Park — Street cleaning reminders</title>
  <meta name="description" content="Street cleaning schedules around Brébeuf and a reminder to add to your calendar.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Brébeuf Park">
  <meta name="theme-color" content="#f4f6f9">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=3">
  <script src="app.js?v=3" defer></script>
</head>
<body>
  <main class="app-container">
    <header class="app-header">
      <div class="brand-icon" aria-hidden="true">P</div>
      <div>
        <h1>Brébeuf Park</h1>
      </div>
    </header>

    <section class="selection-card" aria-label="Your parking spot">
      <h2 class="selection-label">Where did you park?</h2>
      <div class="street-button-grid" role="group" aria-label="Street">
        <button type="button" class="street-btn active" data-street="brebeuf" aria-pressed="true">Rue de Brébeuf</button>
        <button type="button" class="street-btn" data-street="chambord" aria-pressed="false">Rue Chambord</button>
        <button type="button" class="street-btn" data-street="lanaudiere" aria-pressed="false">Rue de Lanaudière</button>
        <button type="button" class="street-btn" data-street="roche" aria-pressed="false">Rue de la Roche</button>
        <button type="button" class="street-btn" data-street="christophe" aria-pressed="false">Avenue Christophe-Colomb</button>
      </div>
      <div class="side-segmented-control" role="group" aria-label="Side of the street">
        <button type="button" class="side-btn" data-side="West" aria-pressed="false">West side</button>
        <button type="button" class="side-btn active" data-side="East" aria-pressed="true">East side</button>
      </div>
    </section>

    <section class="schedule-card" aria-labelledby="next-label">
      <div class="card-header-row">
        <h2 id="next-label" class="eyebrow">Next cleaning</h2>
        <span id="countdown-badge" class="countdown-badge">Loading…</span>
      </div>
      <p id="next-date-text" class="next-date">Loading…</p>
      <p id="cleaning-time" class="cleaning-time">—</p>
      <p id="season-status-badge" class="schedule-detail">April 1 – December 1 · Montreal time</p>
      <button type="button" id="btn-set-reminder" class="btn-reminder" disabled>
        <span class="reminder-label">Add to calendar<small id="reminder-detail">Alert 2 hours before</small></span>
        <span aria-hidden="true">↗</span>
      </button>
    </section>

    <noscript><p>Enable JavaScript to see schedules and create a reminder.</p></noscript>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
